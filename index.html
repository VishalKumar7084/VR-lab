<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Newton's Rings Lab</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* CONTROLS */
        #control-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 700px;
            background: rgba(20, 20, 20, 0.9);
            padding: 20px; border-radius: 12px; border: 1px solid #444;
            display: flex; gap: 20px; color: #ffaa00;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .input-wrapper { flex: 1; }
        label { display: block; font-weight: bold; font-size: 0.9rem; margin-bottom: 8px; color: #ddd; }
        input[type=range] { width: 100%; height: 5px; cursor: pointer; accent-color: #ff4500; background: #333; }

        #vr-hint {
            position: absolute; top: 20px; left: 20px;
            color: rgba(255, 255, 255, 0.6); 
            font-size: 0.9rem; pointer-events: none;
        }
    </style>
    <!-- Three.js Import -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="vr-hint">VR Supported: Click Button Below</div>

    <div id="control-panel">
        <div class="input-wrapper">
            <label>Lens Radius (R)</label>
            <input type="range" id="radiusSlider" min="50" max="200" step="1" value="100">
        </div>
        <div class="input-wrapper">
            <label>Microscope Position (Moves Crosshair)</label>
            <input type="range" id="moveSlider" min="-5" max="5" step="0.005" value="0">
        </div>
    </div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    // --- 1. SCENE SETUP (SAME AS BEFORE) ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111); // Darker lab for better contrast
    scene.fog = new THREE.Fog(0x111111, 5, 30);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.update();

    // --- 2. ROOM & LIGHTS (SAME AS BEFORE) ---
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const ceilingLight = new THREE.PointLight(0xffffff, 0.5, 20);
    ceilingLight.position.set(0, 5, 0);
    scene.add(ceilingLight);
    const ambient = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambient);

    // --- 3. LAB TABLE (SAME AS BEFORE) ---
    const tableGroup = new THREE.Group();
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.7 });
    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 2), woodMat);
    tableTop.position.y = 0.95; tableTop.castShadow = true; tableTop.receiveShadow = true;
    tableGroup.add(tableTop);
    const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.95, 16);
    [[ -1.4, -0.9], [1.4, -0.9], [-1.4, 0.9], [1.4, 0.9]].forEach(p => {
        const leg = new THREE.Mesh(legGeo, woodMat);
        leg.position.set(p[0], 0.475, p[1]); tableGroup.add(leg);
    });
    scene.add(tableGroup);

    // --- 4. DASHBOARD SCREEN (SAME AS BEFORE) ---
    const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) }));
    screenMesh.position.set(0, 2, -2.5); scene.add(screenMesh);

    function updateScreen(R, pos, d5, d10) {
        ctx.fillStyle = "#000"; ctx.fillRect(0,0,512,256);
        ctx.strokeStyle = "#ff4500"; ctx.lineWidth=8; ctx.strokeRect(0,0,512,256);
        ctx.fillStyle = "#ffaa00"; ctx.font = "bold 40px Arial"; ctx.fillText("REAL-TIME DATA", 20, 50);
        ctx.fillStyle = "#fff"; ctx.font = "30px Monospace";
        ctx.fillText(`Radius (R): ${R} cm`, 20, 100);
        ctx.fillText(`Microscope: ${pos} mm`, 20, 140);
        ctx.fillStyle = "#ff4500";
        ctx.fillText(`Dia (n=5) : ${d5} mm`, 20, 200);
        ctx.fillText(`Dia (n=10): ${d10} mm`, 20, 240);
        screenMesh.material.map.needsUpdate = true;
    }

    // --- 5. APPARATUS (SAME SETUP) ---
    const appGroup = new THREE.Group(); appGroup.position.y = 1.0; scene.add(appGroup);
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x222, metalness: 0.8, roughness: 0.4 });
    const brassMat = new THREE.MeshStandardMaterial({ color: 0xB5A642, metalness: 0.6, roughness: 0.3 });

    // Base & Stand
    appGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 0.8), metalMat));
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.6, 16), metalMat);
    pillar.position.set(0, 0.3, -0.3); appGroup.add(pillar);
    
    // Rail
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.04, 0.04), new THREE.MeshStandardMaterial({color:0x888}));
    rail.position.set(0, 0.5, 0); appGroup.add(rail);
    const conn = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.3), metalMat);
    conn.position.set(0, 0.5, -0.15); appGroup.add(conn);

    // Moving Microscope
    const microGroup = new THREE.Group();
    microGroup.position.y = 0.5; appGroup.add(microGroup);
    microGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.06, 0.06), metalMat));
    const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.4, 32), brassMat);
    tube.position.y = 0.15; microGroup.add(tube);
    const eye = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.05, 32), metalMat);
    eye.position.y = 0.35; microGroup.add(eye);
    const obj = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.02, 0.1, 32), brassMat);
    obj.position.y = -0.1; microGroup.add(obj);

    // Light Box & Reflector
    const lBox = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.2), new THREE.MeshStandardMaterial({color:0x111}));
    lBox.position.set(0.6, 0.2, 0); appGroup.add(lBox);
    const reflector = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.15), new THREE.MeshPhysicalMaterial({color:0xffffff, transmission:0.9, opacity:0.5, transparent:true, side:THREE.DoubleSide}));
    reflector.position.set(0, 0.2, 0); reflector.rotation.z = Math.PI/4; reflector.rotation.y = Math.PI/2; appGroup.add(reflector);
    const sLight = new THREE.PointLight(0xffaa00, 2, 2); sLight.position.set(0.5, 0.2, 0); appGroup.add(sLight);


    // --- 6. NEWTON'S RINGS SHADER (UPDATED TO MATCH IMAGE) ---
    // Here is the big change: Dark Red/Orange Colors + Crosshair in Shader
    
    const ringUniforms = { 
        R: { value: 1000 }, 
        lambda: { value: 589e-6 },
        microPos: { value: 0.0 } // To move crosshair
    };

    const ringsMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(0.6, 0.6),
        new THREE.ShaderMaterial({
            uniforms: ringUniforms,
            side: THREE.DoubleSide, transparent: true, blending: THREE.NormalBlending,
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `
                uniform float R; 
                uniform float lambda; 
                uniform float microPos;
                varying vec2 vUv;

                void main() {
                    // Physics: Rings are centered at 0.5, 0.5
                    float scale = 8.0; 
                    vec2 pos = (vUv - 0.5) * 2.0 * scale; 
                    float r = length(pos);
                    float t = (r * r) / (2.0 * R);
                    
                    // Intensity Formula
                    float intensity = pow(sin((4.0 * 3.14159 * t) / lambda / 2.0), 2.0);

                    // --- COLOR MATCHING (Deep Orange/Red -> Yellow) ---
                    // Background is dark reddish-black
                    vec3 darkRed = vec3(0.2, 0.05, 0.0);
                    // Rings fade from Orange-Red to Bright Yellow
                    vec3 ringColor = mix(vec3(0.8, 0.2, 0.0), vec3(1.0, 0.9, 0.4), intensity);
                    
                    vec3 finalColor = mix(darkRed, ringColor, intensity);

                    // --- VIGNETTE (Circular Eyepiece View) ---
                    float dist = length(vUv - 0.5);
                    float circleMask = smoothstep(0.48, 0.4, dist); // Soft edges

                    // --- CROSSHAIR (Moves with Microscope) ---
                    // Convert microPos (mm) to UV space shift
                    // Assuming plate is approx 10mm visual width, scale factor ~0.1
                    float uShift = microPos * 0.15;
                    vec2 crossCenter = vec2(0.5 + uShift, 0.5); // Moves horizontally
                    
                    float lineThick = 0.002;
                    float vLine = step(abs(vUv.x - crossCenter.x), lineThick);
                    float hLine = step(abs(vUv.y - 0.5), lineThick);
                    float crosshair = max(vLine, hLine);

                    // Apply Crosshair (Black line overlay)
                    finalColor = mix(finalColor, vec3(0.0), crosshair * 0.9);

                    // Combine with circular mask
                    gl_FragColor = vec4(finalColor, circleMask);
                }
            `
        })
    );
    ringsMesh.rotation.x = -Math.PI / 2;
    ringsMesh.position.y = 0.035; // Slightly above black plate
    appGroup.add(ringsMesh);

    // Black Base Plate under rings
    const blackPlate = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), new THREE.MeshBasicMaterial({color:0x000}));
    blackPlate.rotation.x = -Math.PI/2; blackPlate.position.y = 0.03;
    appGroup.add(blackPlate);

    // Glass Lens Visual
    const lensObj = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16, 0, Math.PI*2, 0, 0.2), new THREE.MeshPhysicalMaterial({color: 0xffffff, transmission: 0.9, opacity: 0.2, transparent: true, roughness: 0}));
    lensObj.rotation.x = Math.PI; lensObj.position.y = 0.04;
    appGroup.add(lensObj);


    // --- LOGIC LOOP ---
    const sliderR = document.getElementById('radiusSlider');
    const sliderMove = document.getElementById('moveSlider');

    function updatePhysics() {
        const r_val = parseInt(sliderR.value);
        const pos_val = parseFloat(sliderMove.value);
        
        // Update Shader Physics
        ringUniforms.R.value = r_val * 10;
        ringUniforms.microPos.value = pos_val; // Send position to shader for crosshair

        // Move Physical Microscope
        microGroup.position.x = pos_val * 0.02; // Visual movement

        // Calc Data
        const R_mm = r_val * 10;
        const LAMBDA = 589e-6;
        const d5 = Math.sqrt(4 * 5 * LAMBDA * R_mm).toFixed(3);
        const d10 = Math.sqrt(4 * 10 * LAMBDA * R_mm).toFixed(3);

        updateScreen(r_val, pos_val.toFixed(3), d5, d10);
    }

    sliderR.addEventListener('input', updatePhysics);
    sliderMove.addEventListener('input', updatePhysics);
    updatePhysics();

    renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
    });
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

</script>
</body>
</html>
